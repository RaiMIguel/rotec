<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Obrigado! | Rotecº</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/styles.css">

    <style>
        body {
            background: #fff5f2;
            font-family: "Poppins", sans-serif;
            text-align: center;
        }

        .obrigado-container {
            padding: 120px 20px;
            max-width: 900px;
            margin: auto;
        }

        .obrigado-container h1 {
            font-size: 54px;
            font-weight: 900;
            color: #d55900;
            margin-bottom: 20px;
        }

        .obrigado-container p {
            font-size: 22px;
            color: #444;
            margin-bottom: 40px;
        }

        .btn-voltar {
            display: inline-block;
            padding: 15px 35px;
            background: #d55900;
            color: white;
            border-radius: 40px;
            font-size: 20px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-voltar:hover {
            background: #b94700;
        }

        @media (max-width: 768px) {

            .obrigado-container {
                padding: 90px 20px;
            }

            .obrigado-container h1 {
                font-size: 10vw;
            }

            .obrigado-container p {
                font-size: 5vw;
            }

            .btn-voltar {
                font-size: 5vw;
                padding: 12px 28px;
            }
        }
    </style>

</head>

<body>

    <section class="obrigado-container">

        <h1>Mensagem enviada! 🎉</h1>

        <p>
            Obrigado por entrar em contato.<br>
            Retornarei assim que possível.
        </p>

        <a href="/" class="btn-voltar">
            Voltar para o início
        </a>

    </section>

</body>

</html>
